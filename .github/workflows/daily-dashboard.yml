name: daily-dashboard-update

on:
  schedule:
    # 18:00 UTC = 03:00 JST the following day, every day.
    # 03:00 JST is just after last order, so the night that has just ended is
    # complete — including the post-midnight tail, which Ads books under the
    # new date. The old 20:00 JST slot ran before the club had really opened
    # and reported a night nobody had had yet.
    # GitHub may delay scheduled runs under load — the job is idempotent,
    # so a late run is harmless.
    - cron: '0 18 * * *'
  workflow_dispatch:        # manual re-run / recovery

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch data and rebuild data.json
        env:
          GOOGLE_SA_KEY:              ${{ secrets.GOOGLE_SA_KEY }}
          GA4_PROPERTY_ID:            '383604323'
          CAMPAIGN_START:             '2026-07-17'
          # Present only once the MCC / developer token exists.
          # build_data.py skips the Ads fetch entirely while it is empty.
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID:     '2138197168'
        run: python scripts/build_data.py

      - name: Commit and push
        run: |
          git config user.name  "gala-dashboard-bot"
          git config user.email "mashtakeec@gmail.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Report source failures
        run: |
          STATUS=$(python -c "import json;print(json.load(open('data.json'))['meta']['run_status'])")
          echo "run_status=$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "ok" ]; then
            echo "::warning::Dashboard published with run_status=$STATUS — a data source failed. The page shows a stale-data banner."
            exit 1
          fi
